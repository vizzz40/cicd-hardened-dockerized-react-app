name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Test and build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build application
        run: npm run build

  secrets:
    name: Secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan for committed secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  container:
    name: Build, smoke test and scan image
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build production image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: devboard:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify non-root runtime
        run: test "$(docker image inspect devboard:${{ github.sha }} --format '{{.Config.User}}')" != "" && test "$(docker image inspect devboard:${{ github.sha }} --format '{{.Config.User}}')" != "0" && test "$(docker image inspect devboard:${{ github.sha }} --format '{{.Config.User}}')" != "root"

      - name: Smoke test container
        run: |
          docker run --detach --rm --name devboard-smoke --publish 8080:8080 devboard:${{ github.sha }}
          for attempt in {1..15}; do
            if curl --fail --silent http://127.0.0.1:8080/healthz; then
              docker stop devboard-smoke
              exit 0
            fi
            sleep 1
          done
          docker logs devboard-smoke
          docker stop devboard-smoke
          exit 1

      - name: Scan runtime image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: devboard:${{ github.sha }}
          format: table
          exit-code: 1
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH
